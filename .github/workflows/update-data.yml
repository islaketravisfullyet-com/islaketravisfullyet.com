name: Update data

permissions:
  contents: write

on:
  schedule:
    # Run every hour at 2 minutes past the hour (UTC)
    # According to the LCRA (https://hydromet.lcra.org/media),
    # the water data is gathered every 15 minutes and then it takes
    # about 2 minutes to generate new reports.
    - cron: "2 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove stale data
        run: rm assets/data/travis.csv assets/data/travis-10year.csv

      - name: Fetch latest data
        run: |
          set -euo pipefail
          curl -L -fS -o assets/data/travis.csv https://waterdatafortexas.org/reservoirs/individual/travis.csv

      - name: Verify file was downloaded
        run: |
          if [ -f assets/data/travis.csv ]; then
            echo "File downloaded successfully"
            echo "File size: $(wc -c < assets/data/travis.csv) bytes"
            echo "First few lines:"
            head -5 assets/data/travis.csv
            first_non_comment_line=$(grep -m 1 -v '^[[:space:]]*$\|^[[:space:]]*#' assets/data/travis.csv || true)
            if [ -z "$first_non_comment_line" ]; then
              echo "Error: Downloaded file is empty or contains only comments"
              exit 1
            fi
            if printf '%s\n' "$first_non_comment_line" | grep -Eiq '^[[:space:]]*<'; then
              echo "Error: Downloaded file appears to be HTML, not CSV"
              exit 1
            fi
          else
            echo "Error: File was not downloaded"
            exit 1
          fi

      - name: Refresh LakeLevel.csv from LCRA
        continue-on-error: true
        run: |
          set -o pipefail
          curl -L -fS -o assets/data/LakeLevel.csv https://hydromet.lcra.org/media/LakeLevel.csv

      - name: Extract last 10 years of data (3650 lines)
        run: |
          # Extract the header (first non-comment line)
          awk '!/^#/' assets/data/travis.csv | head -n 1 > assets/data/travis-10year.csv
          # Append the last 3650 data lines
          tail -n 3650 assets/data/travis.csv >> assets/data/travis-10year.csv

      - name: Generate live fullness snapshot
        continue-on-error: true
        run: |
          node .github/workflows/compute-live-fullness.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/data/travis.csv assets/data/travis-10year.csv assets/data/travis-live.json
          if git diff -I'^#' --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Lake Travis water level data - $(date)"
            git push
          fi
