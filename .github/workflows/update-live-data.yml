name: Update live data

permissions:
  contents: write

on:
  schedule:
    # Run every hour at 2 minutes past the hour (UTC)
    # According to the LCRA (https://hydromet.lcra.org/media),
    # the water data is gathered every 15 minutes and then it takes
    # about 2 minutes to generate new reports.
    - cron: "2 1-23 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  refresh-live-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate live fullness snapshot
        run: |
          set -o pipefail
          if node .github/workflows/compute-live-fullness.js 2>&1 | tee /tmp/live-fullness.log; then
            exit 0
          fi
          # LCRA sometimes serves an empty LakeLevel.csv around midnight.
          if grep -q "LakeLevel.csv does not contain enough content to parse" /tmp/live-fullness.log; then
            echo "Upstream LakeLevel.csv was incomplete; waiting 1 minute and retrying..."
            sleep 60
            node .github/workflows/compute-live-fullness.js
          else
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/data/travis-live.json
          if git diff -I'^#' --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Lake Travis live data - $(date)"
            git push
          fi
